<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="贏麻神器">
<link rel="manifest" href="./manifest-v7.3.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>贏麻神器 PRO V7.3</title>
<style>
:root{
  --bg:#0D1512; --card:#15201B; --card2:#1B2922; --line:#2A3D33;
  --buy:#34D399; --buy-dim:#1E5C43; --sell:#F87171; --sell-dim:#6B2A2A;
  --red:#EF4444; --red-dim:rgba(239,68,68,0.15);
  --green:#22C55E; --green-dim:rgba(34,197,94,0.15);
  --txt:#E5EFE9; --sub:#8FA79B; --gold:#FBBF24; --blue:#38BDF8;
}
html,body{ margin:0; padding:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;
  min-height:100vh; overflow-y:auto; }
body{ display:flex; align-items:flex-start; justify-content:center; padding:6px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

.app{ width:100%; max-width:940px; background:var(--card);
  border-radius:10px; padding:8px 10px; border:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }

.hdr{ display:flex; align-items:center; justify-content:space-between; gap:4px; flex-wrap:wrap; }
.hdr-left{ display:flex; align-items:center; gap:6px; }
.hdr h1{ font-size:15px; font-weight:900; color:var(--buy); margin:0; letter-spacing:1px; white-space:nowrap; }

.io-btns{ display:flex; gap:3px; }
.io-btn{ background:var(--card2); border:1px solid var(--line); color:var(--sub);
  font-size:13px; font-weight:800; padding:3px 8px; border-radius:5px; cursor:pointer; }
.io-btn:hover{ border-color:var(--buy); color:var(--buy); }

.tabs{ display:flex; gap:4px; }
.tabs button{ background:var(--card2); border:1.5px solid var(--line); color:var(--sub);
  font-size:14px; font-weight:900; padding:4px 10px; border-radius:16px; cursor:pointer; }
.tabs button.on{ background:var(--buy-dim); color:var(--buy); border-color:var(--buy); }

.view{ display:none; flex-direction:column; gap:6px; }
.view.on{ display:flex; }

/* Tab 1 UI Update */
.stk-title-bar{ display:flex; align-items:center; justify-content:space-between; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:14px; flex-wrap:wrap; gap:6px; }
.stk-info{ display:flex; align-items:center; gap:6px; font-weight:900; }
.stk-code{ color:var(--gold); font-size:16px; }
.stk-name{ font-size:16px; color:#FFF; }
.badge{ font-size:11px; padding:1px 5px; border-radius:4px; font-weight:800; display:inline-block; }
.badge-trade{ background:var(--red-dim); color:var(--red); border:1px solid var(--red); }
.badge-hold{ background:rgba(251,191,36,0.15); color:var(--gold); border:1px solid var(--gold); }
.badge-watch{ background:rgba(56,189,248,0.15); color:var(--blue); border:1px solid var(--blue); }

.params-mini{ display:flex; gap:6px; align-items:center; justify-content:flex-end; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; flex-wrap:wrap; }
.params-mini select, .params-mini input{ background:#0F1814; border:1px solid var(--line); border-radius:4px; color:var(--txt); font-size:12px; font-weight:800; padding:2px 4px; text-align:center; }

.pxcard{ background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:6px; }
.pxrow{ display:flex; gap:6px; align-items:center; }
#px{ flex:1; min-width:0; border:2px solid var(--line); border-radius:6px; background:#0F1814;
  color:#FFF; text-align:center; font-size:2.2rem; font-weight:900; padding:0 4px; outline:none; height:48px; }
#px:focus{ border-color:var(--buy); box-shadow:0 0 8px rgba(52,211,153,.35); }
.ibtn{ width:38px; height:48px; border-radius:6px; cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center; flex:none; border:none; background:transparent; transition:.1s; }
.ibtn svg{ width:20px; height:20px; }
.ibtn.s{ border:1px solid #2E7D5B; color:var(--buy); }
.ibtn.d{ border:1px solid #8A3A3A; color:var(--sell); }

.watch{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; align-items:center; }
.wtag{ display:inline-flex; align-items:center; gap:4px; background:#0F1814;
  border:1.5px solid var(--line); border-radius:5px; padding:2px 6px; cursor:pointer;
  font-size:13px; font-weight:800; color:#FFF; }
.wtag .code{ color:#FFF; }
.wtag .px{ color:var(--buy); font-weight:900; }
.wtag button{ background:transparent; border:none; color:#FFF; cursor:pointer; font-size:13px; padding:0; }
.wtag button:hover{ color:var(--sell); }
.wtag.on{ border-color:var(--buy); background:#1C352A; }

.hl-header-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.hl-cell{ background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:4px 6px; text-align:center; }
.hl-cell .lb{ font-size:11px; color:var(--sub); font-weight:800; margin-bottom:2px; display:block; }
.hl-row{ display:flex; gap:4px; align-items:center; justify-content:center; }
.hl-input{ width:120px; background:#0F1814; border:1.5px solid var(--line); border-radius:5px; color:#FFF; font-size:1.6rem; font-weight:900; text-align:center; padding:0; outline:none; height:38px; }
.hl-input:focus{ border-color:var(--buy); }
.hl-btn{ width:32px; height:38px; background:#0F1814; border:1px solid var(--line); color:var(--buy); border-radius:5px; font-size:18px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }

.merged-pos-heading{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;padding:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px}
.merged-pos-heading span{color:var(--sub);font-size:10px;font-weight:400}
.merged-pos-panel{display:block!important;padding-bottom:12px}
.wave-panel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;padding:6px;background:var(--card2);border:1px solid var(--line);border-radius:6px;font-size:13px}
.wave-title{font-weight:800;color:var(--gold)}
.wave-panel label{display:flex;align-items:center;gap:3px;color:var(--sub)}
.wave-panel input{width:72px;background:#0F1814;border:1px solid var(--line);border-radius:4px;color:var(--txt);padding:4px;font-size:14px;text-align:right}
.wave-note{color:var(--sub);font-size:10px}

/* 下單網格排版調整 (全靠左) */
.cols{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.col{ border-radius:6px; padding:4px; display:flex; flex-direction:column; }
.col.g{ background:rgba(52,211,153,.07); border:1px solid rgba(52,211,153,.28); }
.col.r{ background:rgba(248,113,113,.07); border:1px solid rgba(248,113,113,.28); }
.colhead{ text-align:center; font-size:13px; font-weight:900; letter-spacing:2px; padding:4px 0; }
.col.g .colhead{ color:var(--buy); } .col.r .colhead{ color:var(--sell); }

/* 每列使用固定比例網格：[圖示 22px] [價格欄] [百分比欄(靠左)] [股數欄(靠左)] */
.rt{ display:grid; grid-template-columns: 22px 1.2fr 1fr 0.9fr; align-items:center;
  padding:6px 4px; border-radius:4px; cursor:pointer; gap:4px; }
.rt+.rt{ border-top:1px dashed var(--line); }
.rt .star{ font-size:15px; font-weight:bold; text-align:center; flex:none; }
.col.g .rt .star{ color:var(--buy); } .col.r .rt .star{ color:var(--sell); }

/* 1. 價格 (靠左) */
.rt .v{ font-size:19px; font-weight:900; letter-spacing:0.3px; text-align:left; white-space:nowrap; display:flex; align-items:baseline; gap:3px; }
.col.g .v{ color:var(--buy); } .col.r .v{ color:var(--sell); }

/* 2. 百分比 (靠左對齊，顏色與主網格統一) */
.rt .pct-box{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; text-align:left; }
.rt .pct{ font-size:13px; color:var(--sub); font-weight:800; white-space:nowrap; text-align:left; line-height:1.2; }
.rt .diff-sub{ font-size:11px; color:var(--sub); opacity:0.85; margin-top:3px; line-height:1; } 

/* 3. 股數 (靠左對齊 + 字體放大至 16px) */
.rt .sh{ font-size:16px; font-weight:900; text-align:left; white-space:nowrap; }
.rt.zero .sh{ color:var(--sub); opacity:.4; }

/* 輔助價位專屬圖示與標籤 (不加粗、不放大) */
.grid-icon { font-weight:400; font-size:11px; display:inline-block; line-height:1; }
.day-dot{font-size:11px;line-height:1;color:#3B82F6;display:inline-block}
.tag-day{color:#3B82F6!important}
.icon-buy { color:var(--buy); }
.icon-sell { color:var(--sell); }

/* 標籤樣式 (不加框、不加粗) */
.tag-badge{ font-size:11px; line-height:1; padding:1px 2px; border-radius:2px; font-weight:400; white-space:nowrap; cursor:help; margin-left:3px; background:transparent; }
.tag-badge.tag-buy{ color:var(--buy); }
.tag-badge.tag-sell{ color:var(--sell); }

.cols .rt.aux-row{display:none}
.cols.show-aux .rt.aux-row{display:grid}
.aux-toggle-row{display:flex;justify-content:center;margin:0 0 2px}
.aux-toggle{background:var(--card2);border:1px solid var(--line);border-radius:5px;color:var(--blue);font-size:11px;font-weight:400;padding:4px 10px;cursor:pointer}
.aux-toggle:focus{outline:1px solid var(--blue)}


/* 交易目標試算：兩列呈現價格／股數／金額，沿用上方單筆金額 */
.trade-calc{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;display:flex;flex-direction:column;gap:5px}
.trade-calc-head{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:900}
.trade-target{display:flex;align-items:center;gap:4px;margin-right:0}
.trade-target input,.trade-target select{background:#0F1814;border:1px solid var(--line);border-radius:4px;color:var(--gold);font-weight:900;text-align:center;padding:4px}.trade-target select{width:72px;font-size:12px}
.trade-mode{display:flex;gap:4px}
.trade-mode button{background:#0F1814;border:1px solid var(--line);color:var(--sub);border-radius:5px;padding:4px 8px;font-size:12px;font-weight:800}
.trade-mode button.on{border-color:var(--buy);color:var(--buy);background:var(--buy-dim)}
.trade-line{display:grid;grid-template-columns:64px minmax(105px,1fr) 58px 70px 42px;align-items:center;gap:6px;font-size:12px}
.trade-line .trade-label{color:var(--sub);font-weight:900;font-size:13px;white-space:nowrap}
.trade-price-wrap{display:flex;align-items:center;gap:3px;min-width:0}
.trade-price-wrap input{width:100%;min-width:0;background:#0F1814;border:1px solid var(--line);border-radius:4px;color:#fff;font-size:17px;font-weight:900;text-align:center;padding:4px}
.trade-step{display:flex;gap:2px;flex:none}
.trade-step button{width:25px;height:28px;background:#0F1814;border:1px solid var(--line);border-radius:4px;color:var(--buy);font-size:16px;font-weight:900;padding:0}
.trade-value{font-weight:900;font-size:16px;white-space:nowrap;text-align:center}
.trade-amount{font-weight:800;font-size:12px;white-space:nowrap;text-align:right;color:var(--txt)}
.trade-inv-btn{height:29px;min-width:38px;border:1px solid var(--line);border-radius:5px;background:#0F1814;font-size:17px;font-weight:900;cursor:pointer;padding:0 5px}
.trade-inv-btn.add{color:var(--buy);border-color:rgba(52,211,153,.45)}
.trade-inv-btn.remove{color:var(--sell);border-color:rgba(248,113,113,.45)}
.trade-inv-head{font-size:10px;color:var(--sub);text-align:center;white-space:nowrap}
.trade-note{font-size:10px;color:var(--sub);line-height:1.35;padding-top:2px;border-top:1px dashed var(--line)}
@media(max-width:430px){.trade-line{grid-template-columns:52px minmax(78px,1fr) 48px 58px 34px;gap:3px}.trade-line .trade-label{font-size:12px}.trade-price-wrap input{font-size:16px}.trade-step button{width:22px}.trade-value{font-size:15px}.trade-amount{font-size:11px}.trade-inv-btn{min-width:32px;height:27px;padding:0 3px}}

.info-single-bar{ display:flex; align-items:center; justify-content:space-around; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px; font-size:14px; gap:4px; flex-wrap:wrap; }
.info-item{ display:flex; align-items:center; gap:3px; }
.info-item .lbl{ color:var(--sub); font-weight:700; }
.info-item .val{ color:#FFF; font-weight:900; }
.info-item[hidden]{display:none!important;}

.cust{ background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px 8px; display:flex; gap:6px; align-items:center; }
.qbtn{ background:#0F1814; border:1px solid var(--line); color:var(--buy); padding:3px 8px; border-radius:4px; font-size:12px; font-weight:800; cursor:pointer; }
.cust input{ width:50px; border:1px solid var(--line); border-radius:4px; background:#0F1814; color:var(--sell); text-align:center; font-size:13px; font-weight:800; padding:3px; outline:none; }
.cust button.add{ width:26px; height:26px; border-radius:4px; border:1px solid var(--line); background:#0F1814; color:var(--buy); cursor:pointer; font-size:14px; font-weight:900; }
.cust-tags{ display:flex; flex-wrap:wrap; gap:4px; flex:1; }
.ctag{ display:inline-flex; align-items:center; gap:3px; background:#0F1814; border:1px solid var(--line); padding:2px 6px; border-radius:4px; font-size:11px; color:var(--blue); font-weight:800; }
.ctag button{ background:transparent; border:none; color:var(--sell); cursor:pointer; font-size:11px; }

/* Tab 2 Sticky Top Search & Filter */
.tab2-sticky-header{ position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); padding:4px 0 6px 0; display:flex; flex-direction:column; gap:4px; }
.qbar{ display:flex; gap:4px; align-items:center; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:12px; flex-wrap:wrap; }
.qbar select, .qbar input{ background:#0F1814; border:1px solid var(--line); border-radius:4px; color:var(--txt); font-size:12px; font-weight:800; padding:3px 6px; }
.search-input{ flex:1; min-width:120px; outline:none; }
.search-input:focus{ border-color:var(--buy); }
.filter-btn-group{ display:flex; gap:3px; flex-wrap:wrap; }
.filter-btn{ background:#0F1814; border:1px solid var(--line); color:var(--sub); font-size:12px; font-weight:800; padding:3px 8px; border-radius:4px; cursor:pointer; }
.filter-btn.on{ background:var(--buy-dim); color:var(--buy); border-color:var(--buy); }

.poslist, .qlist{ display:flex; flex-direction:column; gap:6px; }
.pos{ background:var(--card2); border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
.pos.today-traded{ border:1.5px solid var(--red); box-shadow:0 0 6px rgba(239,68,68,0.25); }
.pos.hold-pos{ border:1.5px solid rgba(251,191,36,.65); }
.pos .r1{ display:flex; gap:6px; align-items:center; }
.pos .nm{ font-size:15px; font-weight:900; color:var(--gold); cursor:pointer; display:flex; align-items:center; gap:4px; }
.pos .nm .code{ color:var(--sub); font-size:12px; }
.pos .pl{ margin-left:auto; text-align:right; }
.pos .pl .amt{ font-size:14px; font-weight:900; }
.posdel{ background:transparent; border:none; color:var(--sell); cursor:pointer; font-size:16px; font-weight:900; padding:0 4px; margin-left:4px; }

.pos .r2{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; text-align:center; }
.pos .r2 .cell:first-child{border:1px solid #64748b;border-radius:5px;padding:3px 2px;}
.pos .cell{ background:#0F1814; border-radius:4px; padding:3px 2px; }
.pos .cell .lb{ font-size:11px; color:var(--sub); font-weight:700; }
.pos .cell .v{ font-size:18px; font-weight:900; margin-top:1px; }

.pos .r3{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.pos .ref{ background:#0F1814; border:1px solid var(--line); border-radius:4px; padding:3px 2px; text-align:center; cursor:pointer; }
.pos .ref .lb{ font-size:11px; color:var(--sub); font-weight:700; }
.pos .ref .v{ font-size:18px; font-weight:900; }
.pos .ref.tp{ background:var(--red-dim); border-color:var(--red); }
.pos .ref.tp .v{ color:var(--red); }
.pos .ref.sl{ background:var(--green-dim); border-color:var(--green); }
.pos .ref.sl .v{ color:var(--green); }

.pos-action-bar{ display:flex; justify-content:space-between; align-items:center; }
.lot-toggle-btn{ background:transparent; border:none; color:var(--sub); font-size:13px; font-weight:800; cursor:pointer; padding:0; }
.grid-plus-btn{ width:22px; height:22px; background:var(--buy-dim); border:1px solid var(--buy); color:var(--buy); border-radius:4px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }

.lots-container{ display:none; flex-direction:column; gap:3px; background:#0F1814; border-radius:4px; padding:6px; }
.lots-container.open{ display:flex; }
.lot-row{ display:grid; grid-template-columns:42px 1fr auto auto auto; gap:4px; align-items:center; font-size:11px; padding:3px 5px; background:var(--card2); border-radius:4px; white-space:nowrap; }
.lot-tag { font-weight:900; padding:1px 3px; border-radius:3px; text-align:center; font-size:10px; }
.tag-today { background:rgba(239,68,68,.2); color:var(--red); }
.tag-yest { background:rgba(251,191,36,.2); color:var(--gold); }
.tag-past { background:rgba(148,163,184,.15); color:var(--sub); }

.pos .r4{ display:grid; grid-template-columns:80px 1fr; gap:4px; align-items:center; }
.pos .r5{ display:grid; grid-template-columns:80px 56px 1fr; gap:4px; align-items:center; }
.pos .r6{ display:grid; grid-template-columns:80px 1fr; gap:4px; align-items:center; }
.pos .manual-price-btn{background:#0F1814;border:1px solid var(--blue);color:var(--blue);border-radius:4px;padding:3px 6px;font-size:11px;font-weight:800;cursor:pointer}
.tab2-targetbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--sub)}
.tab2-targetbar input{width:58px;background:#0F1814;border:1px solid var(--line);border-radius:4px;color:var(--gold);font-weight:900;text-align:center;padding:3px}
.pos-alert{font-size:11px;color:var(--gold);font-weight:900}
.refin, .sellin{ background:#0F1814; border:1px solid var(--line); border-radius:4px; color:var(--txt);
  font-size:12px; font-weight:800; padding:3px 5px; text-align:center; outline:none; width:100%; }
.pltxt{ font-size:12px; font-weight:900; text-align:right; }
.pltxt.up{ color:var(--red); } .pltxt.dn{ color:var(--green); }
.sellbtn{ background:var(--sell-dim); border:1px solid var(--sell); color:var(--sell);
  border-radius:4px; font-weight:900; font-size:12px; cursor:pointer; padding:3px 0; }
.sellinfo{ font-size:10px; color:var(--sub); text-align:right; }

.global-add-box{ background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px 8px; display:flex; flex-direction:column; gap:4px; }
.global-add-row{ display:flex; gap:4px; align-items:center; }
.big-input{ border:1px solid var(--line); border-radius:4px; background:#0F1814; color:#FFF; font-size:13px; font-weight:900; padding:4px; outline:none; text-align:center; }
.global-add-btn{ height:30px; background:var(--buy-dim); border:1px solid var(--buy); color:var(--buy); border-radius:4px; font-size:13px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none; padding:0 10px; }

.paste-box{ display:flex; flex-direction:column; gap:4px; background:#0F1814; border:1px solid var(--line); border-radius:6px; padding:6px; }
.paste-box textarea{ width:100%; height:40px; background:var(--card2); border:1px solid var(--line); border-radius:4px; color:var(--txt); font-size:12px; padding:4px; outline:none; resize:none; }
.paste-footer{ display:flex; justify-content:space-between; align-items:center; gap:6px; }

#toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
  background:#1C352A; color:var(--buy); border:1.5px solid var(--buy); padding:8px 18px;
  border-radius:20px; font-size:13px; font-weight:900; opacity:0; transition:.25s; pointer-events:none; z-index:99; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

const ICONS = ['①','②','③','④','⑤'];
let cust = [], watch = [], pos = [], curCode = null;
let quotes = { date:'', updateTime:'', rows:{} };

let cardStates = {};

const LABELS_DICT = {

  'E127': { icon: '▲',  text: 'E127 (127.2% 向上延伸)：【第一個滿足點 / 獲利減碼區 20%】', type: 'sell', heavy: false },
  'E138': { icon: '▲',  text: 'E138 (138.2% 向上延伸)：【第二壓力區 / 逐步減碼 25~30%】', type: 'sell', heavy: false },
  'E162': { icon: '▲▲', text: 'E162 (161.8% 向上延伸)：【第三強力滿足點 / 大舉獲利了結 40~50%】', type: 'sell', heavy: true }
};

function checkDateAging(){
  const todayStr = new Date().toDateString();
  const lastDate = localStorage.getItem('lastAppDate');
  if(lastDate && lastDate !== todayStr){
    if(Array.isArray(pos)){
      pos.forEach(p=>{
        if(p && Array.isArray(p.lots)){
          p.lots.forEach(l=>{
            if(l.tag === '今天') l.tag = '昨天';
            else if(l.tag === '昨天') l.tag = '舊';
          });
        }
      });
    }
    localStorage.setItem('pos', JSON.stringify(pos));
  }
  localStorage.setItem('lastAppDate', todayStr);
}

try {
  cust  = JSON.parse(localStorage.getItem('custPct')||'[]');
  watch = JSON.parse(localStorage.getItem('watch')||'[]');
  pos   = JSON.parse(localStorage.getItem('pos')||'[]');
  cardStates = JSON.parse(localStorage.getItem('cardStates')||'{}');
  customHL = JSON.parse(localStorage.getItem('customHL')||'{}');
  waveHL = JSON.parse(localStorage.getItem('waveHL')||'{}');
  quoteHistory = JSON.parse(localStorage.getItem('quoteHistory')||'{}');
  if(!Array.isArray(cust)) cust = [];
  if(!Array.isArray(watch)) watch = [];
  if(!Array.isArray(pos)) pos = [];
  if(!customHL || typeof customHL !== 'object') customHL = {};
  if(!waveHL || typeof waveHL !== 'object') waveHL = {};
  if(!quoteHistory || typeof quoteHistory !== 'object') quoteHistory = {};
  watch = watch.map(w=>({code:String(w.code), name:w.name}));
  const q = JSON.parse(localStorage.getItem('quotes')||'null');
  if(q && q.rows) quotes = q;
  checkDateAging();
} catch(e){
  cust = []; watch = []; pos = []; cardStates = {};
}

const $ = id => document.getElementById(id);
const fmt = (x,d) => (typeof x === 'number' && !isNaN(x)) ? x.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const money = x => (typeof x === 'number' && !isNaN(x)) ? Math.round(x).toLocaleString('zh-TW') : '0';

const tick = p => p<10?0.01 : p<50?0.05 : p<100?0.1 : p<500?0.5 : p<1000?1 : 5;
const dec = t => t<1 ? 2 : 1;
const ceilTick = (x,t) => Math.ceil((x - EPS)/t)*t;
const floorTick = (x,t) => Math.floor((x + EPS)/t)*t;

function getTodayTradedCount(code){
  // V5.1 成交價列不綁定股票代號，因此不拿匿名試算列推定 TAB2 哪支股票有成交。
  const p = pos.find(x=>String(x.code)===String(code));
  return p && Array.isArray(p.lots) ? p.lots.filter(l=>l.tag==='今天').length : 0;
}

function showTab(n){
  [1,2].forEach(i=>{
    $('tab'+i).classList.toggle('on', i===n);
    $('v'+i).classList.toggle('on', i===n);
  });
  if(n===2){ renderQuotes(); renderPos(); }
}
$('tab1').onclick = ()=>showTab(1);
$('tab2').onclick = ()=>showTab(2);

function getStockItems(){
  const map={};
  pos.forEach(p=>{ if(p && p.code) map[String(p.code)]={code:String(p.code),name:p.name||String(p.code)}; });
  watch.forEach(w=>{ if(w && w.code) map[String(w.code)]={code:String(w.code),name:w.name||String(w.code)}; });
  Object.keys(quotes.rows||{}).forEach(code=>{ const q=quotes.rows[code]; if(!map[code]) map[code]={code,name:q.name||code}; });
  return Object.values(map).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
}
function stockDisplayLabel(code){
  const c=String(code||''); if(!c)return '';
  const item=getStockItems().find(x=>String(x.code)===c);
  const name=item?.name||quotes.rows?.[c]?.name||c;
  return `${c} ${name}`;
}
function renderStockSelect(){
  const sel=$('stockSelect'); if(!sel) return;
  if(!sel.matches(':focus')) sel.value=stockDisplayLabel(curCode);
  // 一般畫面重繪不可主動展開選股清單；只有清單原本開啟時才同步內容。
  const menu=$('stockMenu');
  if(menu?.classList.contains('open')) renderStockMenu(sel.matches(':focus')?sel.value:'');
}
function renderStockMenu(query){
  const menu=$('stockMenu'); if(!menu)return;
  const q=String(query||'').trim().toLowerCase();
  const items=getStockItems().filter(x=>!q||x.code.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
  menu.innerHTML=items.length?items.map(x=>`<button type="button" class="stock-menu-item" role="option" data-code="${x.code}" onclick="chooseStockFromMenu('${x.code}')">${x.code} ${x.name}</button>`).join(''):'<div class="stock-menu-empty">沒有符合的股票</div>';
  menu.classList.add('open');
}
function openStockMenu(){renderStockMenu('');}
function closeStockMenu(){ $('stockMenu')?.classList.remove('open'); }
function toggleStockMenu(ev){ev?.stopPropagation();const m=$('stockMenu');if(m?.classList.contains('open'))closeStockMenu();else{ $('stockSelect')?.focus();renderStockMenu('');}}
function chooseStockFromMenu(code){closeStockMenu();selectStock(code);}
function stockComboKeydown(ev){
  if(ev.key==='Escape'){closeStockMenu();return;}
  if(ev.key==='Enter'){
    ev.preventDefault();
    const q=String($('stockSelect')?.value||'').trim().toLowerCase();
    const items=getStockItems().filter(x=>!q||x.code.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
    const hit=items.find(x=>x.code.toLowerCase()===q||x.name.toLowerCase()===q) || items[0];
    if(hit)chooseStockFromMenu(hit.code);
  }
}
function quickSelectStock(value){
  // 輸入期間只篩選下拉清單；必須點選項目或按 Enter 才正式切換股票。
  renderStockMenu(String(value||''));
}
document.addEventListener('click',ev=>{if(!$('stockCombo')?.contains(ev.target))closeStockMenu();});

function selectStock(code){
  if(!code){curCode=null;run();renderV55();return;}
  curCode=String(code);
  loadQuoteToFields(curCode);
  loadWaveFields(curCode);
  if(Number($('px')?.value)>0){v55Price=String($('px').value);}
  // 只切換主畫面；只有按成交價旁的「＋」才加入盤中工作台。
  run();renderV55();
  const fi=$('stockSelect');if(fi)fi.value=stockDisplayLabel(curCode);
  toast((quotes.rows[curCode]?.name||watch.find(w=>w.code===curCode)?.name||pos.find(p=>p.code===curCode)?.name||curCode)+' 已切換');
}

function getFirstGridPct(){
  const mode=$('stepSel')?.value||'2';
  if(mode==='custom'){
    const v=Number($('stepCustomPct')?.value)||2;
    return Math.max(0.1,Math.min(10,v));
  }
  return Number(mode)||2;
}
function saveGridPct(){
  const v=Number($('stepCustomPct')?.value)||2;
  localStorage.setItem('gridCustomPct',String(Math.max(0.1,Math.min(10,v))));
}
function setGridPctMode(){
  const custom=$('stepSel')?.value==='custom';
  if($('stepCustomPct'))$('stepCustomPct').style.display=custom?'inline-block':'none';
  localStorage.setItem('gridFirstPctMode',$('stepSel')?.value||'2');
  run();
}
function commonGridTick(a,b){

function buildGridPrices(first,limit,dir,spacing){
  const out=[];
  const sign=dir==='buy'?-1:1;
  const inside=(p)=>dir==='buy'?(p<first-EPS&&p>limit+EPS):(p>first+EPS&&p<limit-EPS);
  if(!(dir==='buy'?first>limit+EPS:first<limit-EPS))return out;
  out.push(first);
  for(let i=1;i<=4;i++){
    const p=Number((first+sign*spacing*i).toFixed(2));
    if(!inside(p)||Math.abs(p-out[out.length-1])<EPS)break;
    out.push(p);
  }
  return out;
}

}
function resetWaveFromCsv(){
  const q=quotes.rows[curCode]; if(!q){toast('請先匯入行情 CSV');return;}
  const low=Number(q.qLow)||Number(q.low)||0, high=Number(q.qHigh)||Number(q.high)||0;
  waveHL[curCode]={low,high}; $('waveLow').value=low||''; $('waveHigh').value=high||''; save(); run();
  toast('已用 CSV 季高低／當日高低重設波段');
}
function loadWaveFields(code){
  const q=quotes.rows[code]||{}; const w=waveHL[code]||{};
  $('waveLow').value=w.low>0?w.low:(Number(q.qLow)||Number(q.low)||'');
  $('waveHigh').value=w.high>0?w.high:(Number(q.qHigh)||Number(q.high)||'');
}
function persistHL(){ if(curCode){ customHL[curCode]={low:parseFloat($('pxLow').value)||0,high:parseFloat($('pxHigh').value)||0}; save(); } }
function adjustHL(type, dir){
  const input = type === 'low' ? $('pxLow') : $('pxHigh');
  let val = parseFloat(input.value) || parseFloat($('px').value) || 100;
  let t = tick(val);
  if (dir > 0) { val = val + t; } else { val = Math.max(0.01, val - t); }
  input.value = val.toFixed(dec(tick(val)));
  persistHL(); run();
}

function onMainPriceInput(){ if(curCode){const d=v6Draft(curCode);if(!d.originalPrice)d.originalPrice=String(quotes.rows?.[curCode]?.close||d.price||$('px').value);d.price=String($('px').value||'');saveV6Drafts();} run(); }

function sortExpandedPriceRows(){
  const cd=$('cd'), cu=$('cu');
  if(!cd || !cu) return;
  [[cd,'buy'],[cu,'sell']].forEach(([col,dir])=>{
    const rows=Array.from(col.querySelectorAll('.rt'));
    rows.sort((a,b)=>{
      const pa=Number(a.dataset.price)||0, pb=Number(b.dataset.price)||0;
      return dir==='buy' ? pb-pa : pa-pb;
    });
    rows.forEach(r=>col.appendChild(r));
  });
}

function toggleAuxPrices(){
  const box=$('priceCols'); if(!box) return;
  const open=!box.classList.contains('show-aux');
  box.classList.toggle('show-aux',open);
  const extra=$('extraCols'); if(extra) extra.style.display='none';
  $('auxToggle').textContent=open?'收合':'其他價位';
  if(open) sortExpandedPriceRows(); else run();
}

function run(){
  let P = parseFloat($('px').value)||0;

  const codeLabel = curCode || '—';
  const q = curCode ? quotes.rows[curCode] : null;
  const stkName = q ? q.name : (watch.find(w=>w.code===curCode)?.name || (pos.find(p=>p.code===curCode)?.name || '未選擇股票'));
  $('stkCode').textContent = codeLabel;
  renderStockSelect();
  $('stkName').textContent = stkName;

  let badgeHtml = '';
  const tradedCount = getTodayTradedCount(curCode);
  if(tradedCount > 0) badgeHtml += `<span class="badge badge-trade">今成</span> `;
  if(pos.some(p=>p.code===curCode && (p.lots||[]).some(l=>l.sh>0))) badgeHtml += `<span class="badge badge-hold">庫存</span> `;
  if(watch.some(w=>w.code===curCode)) badgeHtml += `<span class="badge badge-watch">自選</span>`;
  if($('stkBadges'))$('stkBadges').innerHTML = ''; 

  const now = new Date();
  const todayStr = `${now.getMonth()+1}/${now.getDate()}`;
  let dtTxt = quotes.date ? `📅 ${quotes.date}${quotes.date!==todayStr?' ⚠舊':''}` : '📅 無資料';
  if(quotes.updateTime) dtTxt += ` ${quotes.updateTime}`;
  $('csvDate').textContent = dtTxt;
  $('avgInfo').textContent = q && q.avg>0 ? `均${fmt(q.avg,1)}` : '';

  if(q){
    $('infoPer').textContent = q.per > 0 ? q.per.toFixed(1) : '—';
    $('infoVolRatio').textContent = q.ratio > 0 ? q.ratio.toFixed(2) + 'x' : '—';
    $('infoBias').textContent = q.bias60 !== 0 ? q.bias60.toFixed(2)+'%' : '—';
    
    let ampVal = q.amplitude;
    $('infoAmplitude').textContent = ampVal > 0 ? ampVal.toFixed(2) + '%' : '—';
  } else {
    $('infoPer').textContent = '—';
    $('infoVolRatio').textContent = '—'; $('infoBias').textContent='—'; $('infoAmplitude').textContent='—';
  }

  if(P<=0) {
    $('cd').innerHTML = '<div class="colhead" aria-hidden="true"></div>';
    $('cu').innerHTML = '<div class="colhead" aria-hidden="true"></div>';
    $('cdx').innerHTML=''; $('cux').innerHTML='';
    $('stepInfo').textContent = '間距 —';
    $('beD').textContent = '—'; $('beN').textContent = '—';
    renderTags(); renderWatch();
    updateTradeCalc();
    if($('v2').classList.contains('on')) renderPos();
    return;
  }

  if(curCode && (!$('waveLow').value || !$('waveHigh').value)) loadWaveFields(curCode);

  // 1–5 網格只依單一基準價（收盤價／成交價）計算；日高低僅作標記。
  const budget = parseFloat($('cap').value)||5000;

  const cd = $('cd'), cu = $('cu');
  cd.innerHTML = '<div class="colhead" aria-hidden="true"></div>';
  cu.innerHTML = '<div class="colhead" aria-hidden="true"></div>';
  ['cdx','cux'].forEach(id=>{if($(id))$(id).innerHTML='<div class="colhead"></div>';}); 

  const t = tick(P);
  const firstPct=getFirstGridPct();
  const limD = v55RoundTick(P*0.9, 'up');
  const limU = v55RoundTick(P*1.1, 'down');
  const buyFirst=gridFirstPrice(P,firstPct,'buy');
  const sellFirst=gridFirstPrice(P,firstPct,'sell');
  const commonTick=Math.max(commonGridTick(buyFirst,limD),commonGridTick(sellFirst,limU));
  const shortestRange=Math.min(Math.max(0,buyFirst-limD),Math.max(0,limU-sellFirst));
  let spacing=Math.round((shortestRange/5)/commonTick)*commonTick;
  spacing=Number(spacing.toFixed(2));
  while(spacing*4>=shortestRange-EPS && spacing>commonTick+EPS){
    spacing=Number((spacing-commonTick).toFixed(2));
  }
  if(spacing<commonTick-EPS || shortestRange<commonTick*5-EPS)spacing=0;
  const buyPrices=spacing>0?buildGridPrices(buyFirst,limD,'buy',spacing):[];
  const sellPrices=spacing>0?buildGridPrices(sellFirst,limU,'sell',spacing):[];
  const enoughLevels=buyPrices.length===5&&sellPrices.length===5;
  $('stepInfo').textContent = enoughLevels&&spacing>0 ? `間距 ${fmt(spacing,dec(commonTick))}` : '間距 —';

  let buys = [], sells = [], auxBuys = [], auxSells = [];
  buyPrices.forEach((price,i)=>buys.push({sym:ICONS[i],price,pct:(price-P)/P*100,labels:[]}));
  sellPrices.forEach((price,i)=>sells.push({sym:ICONS[i],price,pct:(price-P)/P*100,labels:[]}));

  cust.forEach(p=>{
    const amt = P*p/100;
    const buyTarget = floorTick(P-amt, tick(P-amt));
    const sellTarget = ceilTick(P+amt, tick(P+amt));
    auxBuys.push({sym:'📍', price:buyTarget, pct:-p, custom:true, labels:[`自訂${p}%`]});
    auxSells.push({sym:'📍', price:sellTarget, pct:p, custom:true, labels:[`自訂${p}%`]});
  });

  if(q){
    const wave = waveHL[curCode] || {low:Number($('waveLow').value)||Number(q.qLow)||Number(q.low)||0, high:Number($('waveHigh').value)||Number(q.qHigh)||Number(q.high)||0};
    const auxList = [
      {raw:q.qLow,lb:'季低',isBuy:true, isSpecial:true}, {raw:q.qHigh,lb:'季高',isBuy:false, isSpecial:true},
      {raw:q.yHigh,lb:'年高',isBuy:false, isSpecial:true}, {raw:q.yLow,lb:'年低',isBuy:true, isSpecial:true},
      {raw:q.ma5,lb:'5日',isBuy:q.ma5<=P,ma:true}, {raw:q.ma20,lb:'20日',isBuy:q.ma20<=P,ma:true},
      {raw:q.ma60,lb:'60日',isBuy:q.ma60<=P,ma:true}, {raw:q.ma120,lb:'120日',isBuy:q.ma120<=P,ma:true},
      {raw:q.ma240,lb:'240日',isBuy:q.ma240<=P,ma:true}
    ];
    if(q.cross520==='golden') auxList.push({raw:q.ma20||q.close,lb:'黃叉',isBuy:(q.ma20||q.close)<=P,ma:true});
    if(q.cross520==='death') auxList.push({raw:q.ma20||q.close,lb:'死叉',isBuy:(q.ma20||q.close)<=P,ma:true});
    if(wave.high>wave.low && wave.low>0){
      const span=wave.high-wave.low;
      [0.236,0.382,0.5,0.618,0.786].forEach(r=>{
        const level=wave.high-span*r;
        auxList.push({raw:level,lb:'F'+Math.round(r*100),isBuy:level<=P,fib:true});
      });
      [1.272,1.382,1.618].forEach(r=>{
        const level=wave.low+span*r;
        auxList.push({raw:level,lb:'E'+Math.round(r*100),isBuy:level<=P,fib:true});
      });
    }
    auxList.forEach(aux => {
      if(!aux.raw || aux.raw <= 0) return;
      const targetArr = aux.isBuy ? buys : sells;
      const spillArr = aux.isBuy ? auxBuys : auxSells;
      const adjustedPx = aux.isBuy ? floorTick(aux.raw, tick(aux.raw)) : ceilTick(aux.raw, tick(aux.raw));
      const tolerance = Math.max(t*1.5, spacing*0.25);
      let match = aux.ma ? null : targetArr.reduce((best,item)=>{
        const diff=Math.abs(item.price-adjustedPx);
        return diff<=tolerance && (!best || diff<best.diff) ? {item,diff} : best;
      },null);
      
      if(match){
        const shortLabel = aux.lb;
        if(!match.item.labels.includes(shortLabel)) match.item.labels.push(shortLabel);
      } else {
        const iconSymbol = aux.isBuy ? '▼' : '▲';
        spillArr.push({sym:iconSymbol, price:adjustedPx, pct:(adjustedPx-P)/P*100, mk:true, labels:[aux.lb], ma:!!aux.ma});
      }
    });
  }

  // CSV 當日高低價只作圖示，不參與網格計算；與 1–5 同價時合併在同一列。
  const addDayMarker=(raw,label,side)=>{
    const price=Number(raw)||0; if(!(price>0)) return;
    const target=side==='buy'?buys:sells;
    const adjusted=side==='buy'?floorTick(price,tick(price)):ceilTick(price,tick(price));
    const same=target.find(it=>Math.abs(Number(it.price)-adjusted)<EPS);
    if(same){ if(!same.labels.includes(label)) same.labels.push(label); }
    else target.push({sym:'●',price:adjusted,pct:(adjusted-P)/P*100,labels:[label],dayMarker:true});
  };
  if(q){
    if(Number(q.high)>0) addDayMarker(q.high,'當日高',Number(q.high)<=P?'buy':'sell');
    if(Number(q.low)>0) addDayMarker(q.low,'當日低',Number(q.low)<=P?'buy':'sell');
  }
  // 第5階與漲跌停價留在主網格，與1～4階及日高低標記一起依價格排序。
  buys.push({sym:'★', price:limD, pct:(limD-P)/P*100, limit:true, labels:[]});
  sells.push({sym:'★', price:limU, pct:(limU-P)/P*100, limit:true, labels:[]});
  buys.sort((a,b)=>b.price-a.price);
  sells.sort((a,b)=>a.price-b.price);

  // 不再把⑤與★移到獨立區塊；所有主網格價位都在同一欄依價格排序。
  const renderMain = (arr,container,dir)=>arr.forEach(it=>{
    container.appendChild(row(it.sym,it.price,it.pct,sharesFor(it.price,budget),it.limit?'limit':'',curCode,dir,it.labels,P,false));
  });
  
  const renderAux = (arr,container,dir)=>{
    arr.sort((a,b)=>dir==='買'?b.pct-a.pct:a.pct-b.pct);
    arr.forEach(it=>container.appendChild(row(it.sym,it.price,it.pct,sharesFor(it.price,budget),'aux-row '+(it.mk?'mk':'')+(it.custom?' custom':''),curCode,dir,it.labels, P, true)));
  };

  renderMain(buys,cd,'買');
  renderMain(sells,cu,'賣');
  renderAux(auxBuys,cd,'買');
  renderAux(auxSells,cu,'賣');
  
  if($('priceCols').classList.contains('show-aux')) sortExpandedPriceRows();

  const dD = Math.ceil((P*(1+FEE)/(1-FEE-0.0015) - P - EPS)/t)*t;
  const dN = Math.ceil((P*(1+FEE)/(1-FEE-0.003)   - P - EPS)/t)*t;
  if(Math.abs((P+dD)-(P+dN))<EPS){
    $('beDLbl').textContent='當沖／波段保本:'; $('beNLbl').textContent='';
    $('beD').textContent=`${fmt(P+dD,dec(t))} (+${fmt(dD,dec(t))})`; $('beNItem').hidden=true; $('beDItem').hidden=false;
  } else {
    $('beDLbl').textContent='當沖保本:'; $('beNLbl').textContent='波段保本:';
    $('beD').textContent=`${fmt(P+dD, dec(t))} (+${fmt(dD,dec(t))})`; $('beN').textContent=`${fmt(P+dN, dec(t))} (+${fmt(dN,dec(t))})`;
    $('beDItem').hidden=false; $('beNItem').hidden=false;
  }

  renderTags(); renderWatch();
  updateTradeCalc();
  if($('v2').classList.contains('on')) renderPos();
}

function renderTags(){
  const box = $('tags'); box.innerHTML = '';
  cust.forEach((v,i)=>{
    const g = document.createElement('span');
    g.className = 'ctag';
    g.innerHTML = `📍${v}% <button>✕</button>`;
    g.querySelector('button').onclick = ()=>{ cust.splice(i,1); save(); run(); };
    box.appendChild(g);
  });
}

function renderWatch(){
  const box = $('watch'); box.innerHTML = '';
  watch.forEach(w=>{
    const g = document.createElement('span');
    const q = quotes.rows[w.code];
    g.className = 'wtag' + (w.code===curCode ? ' on' : '');
    g.innerHTML = `<span class="code">${w.code}</span>${w.name}${q?` <span class="px">${fmt(q.close,1)}</span>`:''}<button title="移除">✕</button>`;
    g.onclick = e=>{
      if(e.target.tagName==='BUTTON') return;
      curCode = w.code;
      loadQuoteToFields(w.code);
      loadWaveFields(w.code);
      const d=v6Drafts?.[String(w.code)];if(d?.price)v55Price=d.price;else if(Number($('px')?.value)>0)v55Price=String($('px').value);
      run();renderV55();
      toast(q ? `${w.name} ${q.close}` : `${w.name}（CSV無資料）`);
    };
    g.querySelector('button').onclick = ()=>{
      watch = watch.filter(x=>x.code!==w.code);
      if(curCode===w.code) curCode = null;
      save(); renderWatch(); renderStockSelect(); renderV55();
    };
    box.appendChild(g);
  });
  renderStockSelect();
}

function parseNum(s){
  if(s==null) return 0;
  s = String(s).replace(/[",%]/g,'').trim();
  if(!s) return 0;
  if(s.endsWith('萬')) return Math.round(parseFloat(s)*10000)||0;
  return parseFloat(s)||0;
}

function parseQuoteCsv(text, fname, mtime){
  text = text.replace(/^\uFEFF/,'');
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {ok:false, msg:'檔案是空的'};
  const head = csvCells(lines[0]).map(h=>h.replace(/"/g,'').trim());
  
  const findIdx = (pattern) => head.findIndex(h => pattern.test(h));

  const idx = {
    code: findIdx(/^(?:代號|股票代號|代碼|股號)$/),
    name: findIdx(/^(?:名稱|股票名稱|商品)$/),
    close: findIdx(/^(?:成交|成交價|收盤|收盤價|最新價)$/),
    high: findIdx(/^(?:最高|最高價|當日最高|當日最高價)$/),
    low: findIdx(/^(?:最低|最低價|當日最低|當日最低價)$/),
    avg: findIdx(/^(?:成交均價|均價)$/),
    vol: findIdx(/^(?:成交張數|成交量|成交股數|總量)$/),
    vol5: findIdx(/(?:5日日均成交張數|5日均量|5日平均量|5日均成交量)/),
    date: findIdx(/股價日期|交易日期|日期/),
    per: findIdx(/本益比|PER/i),
    qHigh: findIdx(/\d{2}Q[1-4]還原最高價/),
    qLow: findIdx(/\d{2}Q[1-4]還原最低價/),
    qAvg: findIdx(/\d{2}Q[1-4]還原日均價/),
    mHigh: findIdx(/\d{2}M\d{1,2}還原最高價/),
    mLow: findIdx(/\d{2}M\d{1,2}還原最低價/),
    mAvg: findIdx(/\d{2}M\d{1,2}還原日均價/),
    yHigh: findIdx(/\d{4}還原最高價/),
    yLow: findIdx(/\d{4}還原最低價/),
    bias60: findIdx(/^60日還原均線乖離\s*[（(]\s*%\s*[）)]$/),
    amplitude: findIdx(/(?:振幅\(%\)|振幅%|振幅|當日振幅)/),
    ma5: findIdx(/^(?:5日還原均線\s*[（(]元[）)]|MA5|5MA|5日均價|5日均線)$/i),
    ma20: findIdx(/^(?:20日還原均線\s*[（(]元[）)]|MA20|20MA|20日均價|20日均線)$/i),
    ma60: findIdx(/^(?:60日還原均線\s*[（(]元[）)]|MA60|60MA|60日均價|60日均線)$/i),
    ma120: findIdx(/^(?:120日還原均線\s*[（(]元[）)]|MA120|120MA|120日均價|120日均線)$/i),
    ma240: findIdx(/^(?:240日還原均線\s*[（(]元[）)]|MA240|240MA|240日均價|240日均線)$/i)
  };

  if(idx.code === -1) return {ok:false, msg:'找不到股票代號欄位（代號／股票代號／代碼）'};

  const now = new Date();
  const updateTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  
  const fnM = (fname||'').match(/(\d{4})[.\-_](\d{1,2})[.\-_](\d{1,2})/);
  let date = '';
  const rows = {};

  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());
    const code = cols[idx.code];
    if(!code || code==='代號') continue;

    const getVal = (iKey) => (idx[iKey] !== -1 && cols[idx[iKey]] !== undefined) ? parseNum(cols[idx[iKey]]) : 0;

    const vol = getVal('vol');
    const vol5 = getVal('vol5');
    if(!date && idx.date !== -1) date = cols[idx.date] || '';

    rows[code] = {
      name: idx.name !== -1 ? cols[idx.name] : code,
      close: getVal('close'),
      high: getVal('high'),
      low: getVal('low'),
      avg: getVal('avg'),
      per: getVal('per'),
      vol, vol5, ratio: vol5 > 0 ? vol/vol5 : 0,
      mHigh: getVal('mHigh'),
      mLow: getVal('mLow'),
      mAvg: getVal('mAvg'),
      qHigh: getVal('qHigh'),
      qLow: getVal('qLow'),
      qAvg: getVal('qAvg'),
      yHigh: getVal('yHigh'),
      yLow: getVal('yLow'), 
      bias60:getVal('bias60'), 
      amplitude:getVal('amplitude'), 
      ma5:getVal('ma5'), ma20:getVal('ma20'), ma60:getVal('ma60'), ma120:getVal('ma120'), ma240:getVal('ma240')
    };
  }

  if(!date && fnM) date = `${parseInt(fnM[2])}/${parseInt(fnM[3])}`;
  if(!date && mtime){ const d = new Date(mtime); date = `${d.getMonth()+1}/${d.getDate()}`; }
  
  if(!Object.keys(rows).length) return {ok:false, msg:'沒有可解析的資料列'};
  
  const priorRows = quotes.rows || {};
  Object.keys(rows).forEach(code=>{
    const q=rows[code], prev=priorRows[code];
    const oldHist=Array.isArray(quoteHistory[code])?quoteHistory[code]:[];
    if(!(q.vol5>0)){
      const recent=oldHist.slice(-5).map(h=>Number(h.vol)||0).filter(v=>v>0);
      if(recent.length) q.vol5=recent.reduce((a,b)=>a+b,0)/recent.length;
    }
    q.ratio=q.vol5>0&&q.vol>0?q.vol/q.vol5:0;
    q.cross520='';
    if(quotes.date && String(quotes.date)===String(date)) q.cross520=prev?.cross520||'';
    else if(prev && prev.ma5>0 && prev.ma20>0 && q.ma5>0 && q.ma20>0){
      if(prev.ma5<=prev.ma20 && q.ma5>q.ma20) q.cross520='golden';
      else if(prev.ma5>=prev.ma20 && q.ma5<q.ma20) q.cross520='death';
    }
    const hist=Array.isArray(quoteHistory[code])?quoteHistory[code]:[];
    if(prev && quotes.date && !hist.some(h=>h.date===quotes.date)) hist.push({date:quotes.date,ma5:prev.ma5||0,ma20:prev.ma20||0,close:prev.close||0,high:prev.high||0,low:prev.low||0,vol:prev.vol||0});
    hist.push({date,ma5:q.ma5||0,ma20:q.ma20||0,close:q.close||0,high:q.high||0,low:q.low||0,vol:q.vol||0});
    const dedup=[]; const seen=new Set(); hist.reverse().forEach(h=>{const k=String(h.date);if(!seen.has(k)){seen.add(k);dedup.push(h);}}); quoteHistory[code]=dedup.reverse().slice(-260);
  });
  quotes = { date, updateTime, rows };
  save();
  return {ok:true, n:Object.keys(rows).length};
}

function importQuoteFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const buf = e.target.result;
    let text = new TextDecoder('utf-8').decode(buf);
    if(!text.includes('代號')) text = new TextDecoder('big5').decode(buf);
    const res = parseQuoteCsv(text, file.name, file.lastModified);
    if(res.ok){
      toast(`已自動同步 ${res.n} 檔（${quotes.date} ${quotes.updateTime}）`);
      if(curCode && quotes.rows[curCode]) { loadQuoteToFields(curCode); loadWaveFields(curCode); }
      renderWatch(); renderStockSelect(); run(); renderQuotes();
      renderPos();
    } else {
      toast(res.msg);
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function csvCells(line){
  const out=[]; let cur='', quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"' && line[i+1]==='"' && quoted){cur+='"';i++;}
    else if(ch==='"'){quoted=!quoted;}
    else if(ch===',' && !quoted){out.push(cur.trim());cur='';}
    else cur+=ch;
  }
  out.push(cur.trim()); return out;
}
function normalizedDate(dateStr){
  const m=String(dateStr||'').match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m) return null;
  let y=+m[1]; if(y<1000)y+=1911;
  return {y,m:+m[2],d:+m[3],key:y*10000+(+m[2])*100+(+m[3])};
}
function parseCsvData(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length){toast('檔案沒有資料');return;}
  let count=0, skipped=0, duplicate=0;
  const now=new Date(), header=csvCells(lines.find(l=>l.includes('股號')||l.includes('股票代號')||l.startsWith('日期,'))||lines[0]);
  const idx={}; header.forEach((h,i)=>idx[h.replace(/^"|"$/g,'').trim()]=i);
  const brokerHeader=header.includes('股號') && header.includes('股數') && header.includes('單價');
  const hasStructured=header.includes('股號')||header.includes('成本價')||header.includes('股數');
  const existingKeys=new Set(), legacyKeys=new Set(), rowOccurrences=new Map();
  pos.forEach(p=>(p.lots||[]).forEach(l=>{
    if(!l.importKey)return;
    const k=String(l.importKey);
    if(/\|#\d+$/.test(k)) existingKeys.add(k);
    else legacyKeys.add(k);
  }));
  const addLot=(dateStr,name,code,sh,px,sourceIndex)=>{
    code=String(code||'').trim(); sh=Number(sh)||0; px=Number(px)||0;
    if(!code||sh<=0||px<=0){skipped++;return;}
    const d=normalizedDate(dateStr);
    let tag='舊', sortKey=d?d.key:99999999;
    if(d){
      const rowDate=new Date(d.y,d.m-1,d.d);
      const dayDiff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-rowDate)/86400000);
      if(d.y===now.getFullYear()&&d.m===now.getMonth()+1&&d.d===now.getDate())tag='今天';
      else if(dayDiff===1)tag='昨天';
    }
    const baseKey=[dateStr,code,sh,Number(px).toFixed(4)].join('|');
    const occurrence=(rowOccurrences.get(baseKey)||0)+1;
    rowOccurrences.set(baseKey,occurrence);
    const importKey=`${baseKey}|#${occurrence}`;
    if(existingKeys.has(importKey)||(occurrence===1&&legacyKeys.has(baseKey))){duplicate++;return;}
    let p=pos.find(x=>String(x.code)===code);
    if(!p){p={code,name:name||code,lots:[],openLots:false};pos.push(p);}
    if(!Array.isArray(p.lots))p.lots=[];
    p.lots.push({tag,px,sh,date:dateStr,sortKey,importKey});
    existingKeys.add(importKey); count++;
  };
  if(hasStructured){
    if(brokerHeader){
      let cleaned=0;
      const bad=new Set(['115/10/07|900|900','115/10/27|36|36','115/10/27|77|77']);
      pos.forEach(p=>{
        if(String(p.code)!=='4527'||!Array.isArray(p.lots))return;
        const before=p.lots.length;
        p.lots=p.lots.filter(l=>!bad.has(`${String(l.date||'')}|${Number(l.sh)}|${Number(l.px)}`));
        cleaned+=before-p.lots.length;
      });
      if(cleaned) toast(`已清除 ${cleaned} 筆 4527 舊版錯誤批次，重新匯入正確資料`);
    }
    const rowsStart=lines.findIndex(l=>l===lines.find(x=>x.includes('股號')||x.includes('股票代號')||l.startsWith('日期,')));
    const hdr=csvCells(lines[rowsStart]);
    const map={}; hdr.forEach((h,i)=>map[h.trim()]=i);
    for(let i=rowsStart+1;i<lines.length;i++){
      const cols=csvCells(lines[i]); if(cols.length<4)continue;
      const dateStr=cols[map['日期']]||'';
      const name=cols[map['商品']]||cols[map['名稱']]||'';
      const code=cols[map['股號']]||cols[map['股票代號']]||'';
      const sh=Number(String(cols[map['股數']]||'').replace(/,/g,''))||0;
      let px=0;
      if(brokerHeader){
        const raw=String(cols[map['單價']]||'').replace(/,/g,'').trim();
        if(raw!=='--' && raw!=='－' && raw!=='-' && raw!=='') px=Number(raw)||0;
      } else {
        const priceCol=map['成本價']!==undefined?'成本價':(map['買價']!==undefined?'買價':(map['價格']!==undefined?'價格':''));
        if(priceCol!=='')px=Number(String(cols[map[priceCol]]||'').replace(/,/g,''))||0;
        else if(cols.length===5)px=Number(String(cols[4]||'').replace(/,/g,''))||0;
      }
      addLot(dateStr,name,code,sh,px,i);
    }
  } else {
    lines.forEach(line=>{
      const codeMatch=line.match(/\b([1-9]\d{3,5})\b/);
      const nums=line.match(/(?:\d{1,6}(?:,\d{3})*|\d+)(?:\.\d+)?/g);
      if(codeMatch&&nums&&nums.length>=2){
        const code=codeMatch[1], px=Number(nums[nums.length-2].replace(/,/g,'')), sh=Number(nums[nums.length-1].replace(/,/g,''))||1000;
        if(px>0&&px<5000)addLot(new Date().toLocaleDateString('zh-TW'),code,code,sh,px,i);
      }
    });
  }
  pos.forEach(p=>{if(Array.isArray(p.lots))p.lots.sort((a,b)=>(a.sortKey??99999999)-(b.sortKey??99999999));});
  if(count>0){
    save();renderPos();renderStockSelect();renderV55();
    $('pasteInput').value='';
    toast(`匯入 ${count} 筆；略過無有效單價 ${skipped} 筆；重複 ${duplicate} 筆`);
  }else if(duplicate>0)toast(`沒有新增；已略過 ${duplicate} 筆重複紀錄及 ${skipped} 筆無有效單價資料`);
  else toast(`沒有可匯入的有效成交紀錄（略過 ${skipped} 筆）`);
}

function importDataFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const json = JSON.parse(e.target.result);
      if(json.watch && json.pos){
        if(confirm('確定要匯入資料嗎？')){
          watch = (Array.isArray(json.watch) ? json.watch : []).map(w=>({code:String(w.code), name:w.name}));
          cust = Array.isArray(json.cust) ? json.cust : [];
          pos = Array.isArray(json.pos) ? json.pos : [];
          if(json.cardStates) cardStates = json.cardStates;
          if(json.customHL) customHL = json.customHL;
          if(json.waveHL) waveHL = json.waveHL;
          if(json.quoteHistory) quoteHistory = json.quoteHistory;
          if(json.sellRefs) localStorage.setItem('sellRefs',JSON.stringify(json.sellRefs));
          if(json.quotes && json.quotes.rows) quotes = json.quotes;
          save(); run(); renderPos(); renderQuotes();
          toast('還原成功！');

      }
    } catch(err){ alert('解析失敗：' + err); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function importInventoryFile(evt){
  const f=evt.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    const bytes=new Uint8Array(e.target.result);
    let txt='';
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(_){txt=new TextDecoder('big5').decode(bytes);}
    const r=parseInventoryCsv(txt);
    toast(r.ok?`庫存已完整覆蓋：${r.n} 檔${r.unknown?`；${r.unknown} 檔成本資料不足，保本/目標/停損價暫不計算`:''}（${invUpdatedAt}）`:r.msg);
    if(r.ok){renderInv();renderQuotes();renderStockSelect();run();}
    evt.target.value='';
  };
  rd.readAsArrayBuffer(f);
}
function parseInventoryCsv(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return{ok:false,msg:'檔案是空的'};
  const hi=lines.findIndex(l=>/股號|股票代號|股票,|股名|餘股數/.test(l));
  if(hi<0)return{ok:false,msg:'找不到股票代碼欄位，請確認是券商全部庫存明細'};
  const h=csvCells(lines[hi]).map(x=>x.replace(/^"|"$/g,'').trim());
  const idx=names=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
  const ci=idx(['股號','股票代號','代號','股票']);
  const si=idx(['股數','庫存股數','餘股','庫存數量','餘股數']);
  const ni=idx(['商品','名稱','股票名稱','股名']);
  const costPxI=idx(['成本價','單位成本','均價']);
  const costTotalI=idx(['成本']);
  const mi=idx(['庫存市值','市值']);
  const marketPxI=idx(['市價','參考價','目前價格']);
  if(ci<0||si<0)return{ok:false,msg:'缺少「股票」或「餘股數」欄位'};
  const np=[];
  for(let i=hi+1;i<lines.length;i++){
    const c=csvCells(lines[i]),code=String(c[ci]||'').trim();
    if(!/^\d{4,6}$/.test(code))continue;
    const sh=parseNum(c[si]);if(sh<=0)continue;
    let px=costPxI>=0?parseNum(c[costPxI]):0;
    if(px<=0&&costTotalI>=0){const totalCost=parseNum(c[costTotalI]);if(totalCost>0)px=totalCost/sh;}
    const marketPrice=marketPxI>=0?parseNum(c[marketPxI]):0;
    const name=ni>=0?(c[ni]||code):code;
    let p=np.find(x=>x.code===code);
    if(!p){p={code,name,lots:[],openLots:false,marketPrice:0};np.push(p);}
    if(marketPrice>0)p.marketPrice=marketPrice;
    p.lots.push({tag:'舊',px:px>0?px:0,sh,date:'券商庫存',sortKey:i,costKnown:px>0});
  }
  if(!np.length)return{ok:false,msg:'沒有解析到有效持股，請檢查「股票」及「餘股數」資料'};
  pos=np;
  const n=new Date();
  invUpdatedAt=`${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  localStorage.setItem('invUpdatedAt',invUpdatedAt);save();
  const unknown=np.reduce((a,p)=>a+(p.lots||[]).some(l=>!(Number(l.px)>0))?1:0,0);
  return{ok:true,n:np.length,unknown};
}
function renderInv(){
  const list=$('poslist');if(!list)return;list.innerHTML='';
  if($('invTime'))$('invTime').textContent=invUpdatedAt?`更新：${invUpdatedAt}`:'尚未匯入';
  if(!Array.isArray(pos)||!pos.length){list.innerHTML='<div style="text-align:center;color:var(--sub);padding:15px;font-size:12px">尚無庫存，請匯入券商「全部庫存明細」CSV（完整覆蓋）</div>';return;}
  const filteredPos=pos.slice().filter(p=>{
    const k=($('tab2Search')?.value||'').trim().toLowerCase();
    const matchSearch=!k||String(p.code).toLowerCase().includes(k)||String(p.name||'').toLowerCase().includes(k);
    const matchToday=tab3Filter!=='today'||getTodayTradedCount(p.code)>0;
    return matchSearch&&matchToday;
  }).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
  if(!filteredPos.length){list.innerHTML=tab3Filter==='today'?'<div style="text-align:center;color:var(--sub);padding:15px;font-size:12px">今天尚未在 TAB1 輸入成交價。</div>':'<div style="text-align:center;color:var(--sub);padding:15px;font-size:12px">沒有符合搜尋條件的庫存。</div>';return;}
  filteredPos.forEach(p=>{
    const todayTradedCount=getTodayTradedCount(p.code);
    let sh=0,cost=0,knownSh=0;
    (p.lots||[]).forEach(l=>{const n=Number(l.sh)||0;sh+=n;if(Number(l.px)>0){cost+=Number(l.px)*n;knownSh+=n;}});
    const costKnown=sh>0&&knownSh===sh,avg=costKnown?cost/sh:0,q=quotes.rows[p.code]||{},ref=q.close>0?q.close:(p.marketPrice>0?p.marketPrice:avg),t=tick(ref||100);
    const be=costKnown?ceilTick(avg*(1+TAB2_COST_BUFFER),t):0,tp=costKnown?ceilTick(avg*(1+TAB2_COST_BUFFER+tab2TargetPct/100),t):0,sl=costKnown?floorTick(avg*.985,t):0,mv=ref*sh,pl=costKnown?(ref-avg)*sh:null;
    const card=document.createElement('div');card.className='pos';
    card.innerHTML=`<div class="r1"><span class="nm"><span class="code">${p.code}</span>${p.name||p.code}${todayTradedCount>0?`<span class="badge badge-trade">今日成交 ${todayTradedCount}</span>`:''}</span><div class="pl"><div class="amt">${sh.toLocaleString()} 股</div></div></div><div class="r2"><div class="cell"><div class="lb">成本</div><div class="v">${costKnown?fmt(avg,2):'未提供'}</div></div><div class="cell"><div class="lb">參考價</div><div class="v"><button class="tk" onclick="adjInvRef('${p.code}',-1)">−</button>${fmt(ref,2)}<button class="tk" onclick="adjInvRef('${p.code}',1)">＋</button></div></div><div class="cell"><div class="lb">市值</div><div class="v">${money(mv)}</div></div><div class="cell"><div class="lb">損益</div><div class="v" style="color:${pl===null?'var(--sub)':(pl>=0?'var(--red)':'var(--green)')}">${pl===null?'—':(pl>=0?'+':'')+money(pl)}<br><span style="font-size:10px">${costKnown?(pl/cost*100).toFixed(2)+'%':'成本資料不足'}</span></div></div></div><div class="r3"><div class="ref" ${costKnown?`onclick="copyOrder('${p.code}','賣',${be},${sh})"`:''}><div class="lb">保本 +0.4%</div><div class="v">${costKnown?fmt(be,2):'—'}</div></div><div class="ref tp" ${costKnown?`onclick="copyOrder('${p.code}','賣',${tp},${sh})"`:''}><div class="lb">目標 +${tab2TargetPct.toFixed(1)}%</div><div class="v">${costKnown?fmt(tp,2):'—'}</div></div><div class="ref sl" ${costKnown?`onclick="copyOrder('${p.code}','賣',${sl},${sh})"`:''}><div class="lb">停損 −1.5%</div><div class="v">${costKnown?fmt(sl,2):'—'}</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;padding:3px 2px 0"><span style="font-size:11px;color:var(--sub)">${q.ratio>0?'量比 '+q.ratio.toFixed(2)+'x':''}${q.high>0?'｜距日高 '+((q.high/ref*100)-100).toFixed(1)+'%':''}${q.low>0?'｜距日低 '+((ref/q.low*100)-100).toFixed(1)+'%':''}</span><button class="io-btn" style="color:var(--buy);border-color:var(--buy)" onclick="loadQuoteToTab1('${p.code}')">⚡ 去下單</button></div>`;
    list.appendChild(card);
  });
}
